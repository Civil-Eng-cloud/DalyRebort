name: Process Daily Report

on:
  issues:
    types: [opened]

jobs:
  append-to-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth PyYAML

      - name: Process Issue and Append to Sheet
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          cat << 'EOF' > process_report.py
          import os
          import json
          import yaml
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          # Setup credentials
          gcp_key_str = os.environ.get("GCP_SA_KEY")
          spreadsheet_id = os.environ.get("SPREADSHEET_ID")
          issue_body = os.environ.get("ISSUE_BODY", "")

          if not gcp_key_str or not spreadsheet_id:
              print("Missing GCP_SA_KEY or SPREADSHEET_ID secrets.")
              exit(1)

          # Parse Google Credentials
          creds_dict = json.loads(gcp_key_str)
          scopes = ["https://docs.google.com/spreadsheets/d/1FnV2fpotARUuDkb6AJoHYKT0iZyE-rgQxUudJxm7IRw/edit?pli=1&gid=0#gid=0"]
          creds = Credentials.from_service_account_info(creds_dict, scopes=scopes)
          service = build('sheets', 'v4', credentials=creds)

          # Parse Issue Body Markdown Form Data
          parsed_data = {}
          current_key = None
          
          for line in issue_body.splitlines():
              if line.startswith("### "):
                  current_key = line.replace("### ", "").strip()
                  parsed_data[current_key] = ""
              elif current_key and line.strip() != "_No response_":
                  parsed_data[current_key] += line.strip() + " "

          # Mapping parsed data to target schema
          row_data = [
              parsed_data.get("Report ID", "").strip(),
              parsed_data.get("Employee ID", "").strip(),
              parsed_data.get("Report Date", "").strip(),
              parsed_data.get("Achievements", "").strip(),
              parsed_data.get("Challenges", "").strip(),
              parsed_data.get("Solutions", "").strip(),
              parsed_data.get("Is Resolved?", "").strip(),
              parsed_data.get("Management Support Needed?", "").strip(),
              "No" # Default IsCommentSeen
          ]

          # Append row to Sheet1
          body = {'values': [row_data]}
          result = service.spreadsheets().values().append(
              spreadsheetId=spreadsheet_id,
              range="Sheet1!A:I",
              valueInputOption="USER_ENTERED",
              body=body
          ).execute()

          print(f"Appended {result.get('updates').get('updatedCells')} cells.")
          EOF
          python process_report.py