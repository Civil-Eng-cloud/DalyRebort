name: Process Daily Report

on:
  issues:
    types: [opened]

jobs:
  append-to-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth PyYAML

      - name: Process Issue and Append to Sheet
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          cat << 'EOF' > process_report.py
          import os
          import json
          from datetime import datetime
          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build

          gcp_key_str = os.environ.get("GCP_SA_KEY")
          spreadsheet_id = os.environ.get("SPREADSHEET_ID")
          issue_body = os.environ.get("ISSUE_BODY", "")
          issue_number = os.environ.get("ISSUE_NUMBER", "")

          if not gcp_key_str or not spreadsheet_id:
              print("Missing GCP_SA_KEY or SPREADSHEET_ID secrets.")
              exit(1)

          # Parse Google Credentials
          creds_dict = json.loads(gcp_key_str)
          scopes = ["https://www.googleapis.com/auth/spreadsheets"]
          creds = Credentials.from_service_account_info(creds_dict, scopes=scopes)
          service = build('sheets', 'v4', credentials=creds)

          # Parse Markdown Form Headers
          parsed_data = {}
          current_key = None
          
          for line in issue_body.splitlines():
              line_str = line.strip()
              if line_str.startswith("### "):
                  current_key = line_str.replace("### ", "").strip()
                  parsed_data[current_key] = ""
              elif current_key and line_str and line_str != "_No response_":
                  parsed_data[current_key] += line_str + " "

          def get_field(possible_keys):
              for key_search in possible_keys:
                  for actual_key in parsed_data:
                      if key_search.lower() in actual_key.lower():
                          return parsed_data[actual_key].strip()
              return ""

          today_str = datetime.now().strftime("%Y-%m-%d")

          # Mapping fields matching Sheet1!A:I
          row_data = [
              f"REP-{issue_number}",                                      # ReportID
              get_field(["empID", "المعرف الوظيفي", "Employee ID"]),      # empID
              today_str,                                                 # RepDate
              get_field(["Achievement", "الإنجازات اليومية"]),            # Achievement
              get_field(["Challenges", "التحديات والعرقلات"]),             # Challenges
              get_field(["Solution", "الحلول المقترحة"]),                 # Solution
              get_field(["IsResolved", "تم حل التحدي"]),                   # IsResolved
              get_field(["ManageCo", "توجيهات أو ملاحظات"]),               # ManageCo
              "No"                                                       # IsCommentSeen
          ]

          body = {'values': [row_data]}
          result = service.spreadsheets().values().append(
              spreadsheetId=spreadsheet_id,
              range="Sheet1!A:I",
              valueInputOption="USER_ENTERED",
              body=body
          ).execute()

          print(f"Successfully added row to Google Sheet!")
          EOF
          python process_report.py